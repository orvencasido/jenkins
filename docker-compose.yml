services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    restart: unless-stopped
    environment:
      # Cap JVM heap to 512MB and use G1GC to prevent OOM on e2-micro
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -Djava.awt.headless=true
    volumes:
      - jenkins_home:/var/jenkins_home
    expose:
      - "8080"
    networks:
      - jenkins_net

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Enables HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - jenkins
    networks:
      - jenkins_net

volumes:
  jenkins_home:
  caddy_data:
  caddy_config:

networks:
  jenkins_net:
    driver: bridge
